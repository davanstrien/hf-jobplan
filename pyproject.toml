[project]
name = "hf-jobplan"
version = "0.0.1"
description = "hf CLI extension: print what an agent needs to run a model on Hugging Face Jobs. Launches nothing."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=1.0"]

# The `hf` CLI extension loader expects a console script named exactly `hf-jobplan`.
# Installed with `hf extensions install <owner>/hf-jobplan`, invoked as `hf jobplan ...`.
[project.scripts]
hf-jobplan = "hf_jobplan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_jobplan"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 160
